name: Prova e pubblica il sito

on:
  push:
  workflow_dispatch:

jobs:
  prove:
    # Verifica il motore: test delle regole e partite bot contro bot con tutti i mazzi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto (se caricato come zip)
        run: if [ -f progetto.zip ]; then unzip -o -q progetto.zip; fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test delle regole
        run: node test/rules_test.mjs
      - name: Partite bot contro bot
        run: node test/duel.mjs 1

  sito:
    # Versione per iPhone (e qualsiasi browser): pubblicata su GitHub Pages
    needs: prove
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto (se caricato come zip)
        run: if [ -f progetto.zip ]; then unzip -o -q progetto.zip; fi
      - name: Prepara il sito
        run: |
          mkdir -p site
          cp -r web/* site/
          # la versione cambia a ogni pubblicazione, così l'aggiornamento arriva subito sui telefoni
          sed -i "s/mtgt-app-v1/mtgt-app-${{ github.run_number }}/" site/sw.js
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
